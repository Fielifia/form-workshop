<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Build, configure, validate and export custom HTML forms."
    />
    <title>Form Workshop</title>
    <link rel="stylesheet" href="src/styles/main.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <h1>Form Workshop</h1>
        <p>Build your own forms. Configure. Preview. Export.</p>
      </div>
    </header>

    <main class="container">
      <section class="welcome" aria-labelledby="welcome-heading">
        <h2 id="welcome-heading">Your form workspace</h2>
        <p>Configure your form fields below.</p>
      </section>

      <section class="form-editor" aria-labelledby="editor-heading">
        <h2 id="editor-heading">Form fields</h2>
        <div id="field-editor" aria-live="polite"></div>
      </section>

      <section class="form-preview" aria-labelledby="editor-heading">
        <h2 id="preview-heading">Preview your form</h2>
        <div id="form-preview"></div>
      </section>

      <section class="form-export" aria-labelledby="export-heading">
        <h2 id="export-heading">Export your form</h2>
        <p>Download your form as a standalone HTML file.</p>
        <button id="export-form" type="button">Export HTML</button>
        <p id="export-feedback" role="status" aria-live="polite"></p>
      </section>
      
    </main>
  </body>
</html>
